[project]
name = "bookingkoala-api-mcp"
version = "1.0.5"
description = "Self-hosted BookingKoala API and MCP server on your own Chrome session. Use BookingKoala from Claude, Cursor, Codex or any MCP client or AI agent."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business :: Scheduling"]
requires-python = ">=3.11"
authors = [{ name = "Cotlet", email = "contact@cotlet.dev" }]
keywords = ["bookingkoala", "bookingkoala api", "bookingkoala mcp", "booking", "home services", "mcp server", "claude", "chatgpt", "cursor"]
dependencies = [
    "curl_cffi>=0.13,<0.17",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.12,<2",
    "jsonschema>=4.20",
    "websockets>=13",
]

[project.urls]
Homepage = "https://cotlet.dev/integrations/bookingkoala-api-mcp-server"
Source = "https://github.com/cotletdev/bookingkoala-api-mcp-server"

[project.scripts]
bookingkoala-mcp = "bookingkoala_api_mcp.cli:main"
bookingkoala-api-mcp = "bookingkoala_api_mcp.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookingkoala_api_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"
